<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Provenance Verification</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        input[type=file] {
            margin: 20px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1259a8;
        }

        footer {
            margin-top: 30px;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Media Provenance Verification</h1>

    <p>
        Upload an image to verify its provenance using
        digital signatures, hard binding, and soft binding.
    </p>

    <form action="/verify" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            accept=".jpg,.jpeg,.png"
            required>

        <br><br>

        <button type="submit">
            Verify Image
        </button>

    </form>

    <footer>
        Provenance Verification
    </footer>

</div>

</body>
</html>
